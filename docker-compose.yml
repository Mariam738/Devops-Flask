name: barq-assessment
x-app: &app
  build: .
  init: true
  restart: "unless-stopped"
  env_file: ./config/app.env
  environment: &app-env
    APP_HOST: "0.0.0.0"
    APP_PORT: "8080"
    APP_MESSAGE: "Welcome to BARQ Systems"
  healthcheck:
    # Uses Python's built-in urllib to query the health endpoint.
    # Benefit: Eliminates the need to install curl or wget in the slim base image.
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)"]
    interval: 5s      # How often to run the check
    timeout: 3s       # Maximum time to wait for a response
    retries: 3        # Failures required to mark the container unhealthy
    start_period: 10s  # Grace period for app startup (adjust if your app needs more boot time)
  deploy:
    resources:
      limits:
        cpus: '0.50'
        memory: 512M
      reservations:
        cpus: '0.10'
        memory: 128M
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [frontend, backend]
services:
  postgres:
    # Lightweight Alpine base for minimal footprint
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: "unless-stopped"
    container_name: postgres
    env_file:
      - ./config/app.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barq_app -d barq_tasks"] # Native DB readiness check
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks: [backend]
  redis:
    # Minimal Alpine base for speed and low memory
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: "unless-stopped"
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
    - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"] # Standard ping to verify responsiveness
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 3s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks: [backend]
  app-01:
    <<: *app
    container_name: app-01
    environment:
      <<: *app-env
      INSTANCE_ID: "app-01"
  app-02:
    <<: *app
    container_name: app-02
    environment:
      <<: *app-env
      INSTANCE_ID: "app-02"
  nginx:
    # Ultra-light Alpine base for reverse proxy performance
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: "unless-stopped"
    container_name: nginx
    ports: ["127.0.0.1:${PUBLIC_PORT:-8080}:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    healthcheck:
      test: ["CMD", "nginx", "-t"] # Validates config syntax and daemon health
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    depends_on: [app-01, app-02]
    networks: [frontend]
networks:
  frontend:
  backend:
    internal: true
volumes:
  postgres-data:
  redis_data:
