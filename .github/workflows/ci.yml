name: CI

on:
  push:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 1.5 Generate app.env
      - name: Generate app.env from GitHub Secrets and Env Vars
        run: |
          mkdir -p config
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> config/app.env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> config/app.env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> config/app.env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> config/app.env
          echo "REDIS_URL=${{ secrets.REDIS_URL }}" >> config/app.env

      # 2. Syntax & Compose validation
      - name: Validate Docker Compose configuration
        run: docker compose config

      # 3. Build containers
      - name: Build Docker images
        run: docker compose build
      
      # 4 & 5. Start containers and wait for all healthchecks to pass automatically
      - name: Start containers and wait for readiness
        run: docker compose up -d --wait
      
      # 6. Validate (Run your endpoint and failure/recovery tests)
      - name: Run Validation Scripts
        run: |
          echo "-> Running validate.py..."
          python validate.py

          echo "-> Running failure_test.py..."
          python failure_test.py

